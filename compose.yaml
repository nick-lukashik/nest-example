# Local dependencies: pnpm infra:up | infra:down | infra:reset (drops data).
# Credentials are local-only placeholders; real ones come from the environment.
name: nest-example

services:
    postgres:
        image: postgres:18.6-alpine
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
            POSTGRES_DB: app
        ports: ["5432:5432"]
        volumes:
            - postgres:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 5s
            timeout: 3s
            retries: 20

    redis:
        image: redis:8.10.3-alpine
        command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
        ports: ["6379:6379"]
        volumes:
            - redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

    rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        environment:
            RABBITMQ_DEFAULT_USER: app
            RABBITMQ_DEFAULT_PASS: app
        ports: ["5672:5672", "15672:15672"]
        volumes:
            - rabbitmq:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            interval: 10s
            timeout: 10s
            retries: 20

volumes:
    postgres:
    redis:
    rabbitmq:
